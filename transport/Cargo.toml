[package]
name = "transport"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.32"
nym-bin-common = { version = "1.21.0", features = ["basic_tracing"] }
nym-sdk = "1.21.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["std"] }
thiserror = "2.0.18"
tokio = { version = "1.21.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[patch.crates-io]
nym-bin-common = { git = "https://github.com/IRClichtR/nym-forked", branch = "develop" }
nym-sdk = { git = "https://github.com/IRClichtR/nym-forked", branch = "develop" }
